# Sede tal como aparece en: python -m actionbot sedes
sede: PepeSierra

# Horas antes del inicio de la clase en que se abre la reserva
apertura_horas: 24

# Horario exacto por dia de la semana. Para cada dia, la clase y hora exactas.
# Puedes poner varias opciones por dia (lista) y se intentan en orden hasta
# lograr una. Los dias que NO aparezcan no se reservan.
#   dias validos: lun, mar, mie, jue, vie, sab, dom
plan_semanal:
  lun:
    - { clase: TONIC, hora: "11:00" }
  mar:
    - { clase: SAVAGE, hora: "08:40" }
  mie:
    - { clase: SAVAGE, hora: "10:00" }
  jue:
    - { clase: TONIC, hora: "10:00" }
  vie:
    - { clase: TONIC, hora: "06:15" }
  sab:
    - { clase: TONIC, hora: "07:10" }
  dom:
    - { clase: SAVAGE, hora: "07:15" }

# Si la apertura fallo o el gimnasio cancela, el bot sigue cazando cupo
# liberado cada intervalo_min minutos hasta que empiece la clase.
rescate:
  activo: true
  intervalo_min: 15

# Ajustes del disparo
adelanto_seg: 2
rafaga_seg: 120
intervalo_seg: 0.5

# Aviso por correo. Usa Gmail: necesitas una CONTRASENA DE APLICACION
# (myaccount.google.com -> Seguridad -> Verificacion en 2 pasos ->
# Contrasenas de aplicaciones) y la guardas en .env como SMTP_PASS.
notificar_email: jesilvestrep@gmail.com

