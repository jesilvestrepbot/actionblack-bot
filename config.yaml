# Sede tal como aparece en: python -m actionbot sedes
sede: PepeSierra

# Horas antes del inicio de la clase en que se abre la reserva
apertura_horas: 24

# Horario exacto por dia de la semana. Para cada dia, la clase y la hora
# exactas que quieres. Puedes poner varias opciones por dia (lista) y se
# intentan en orden hasta lograr una. Los dias que NO aparezcan aqui no se
# reservan (el bot no los toca).
#   dias validos: lun, mar, mie, jue, vie, sab, dom
plan_semanal:
  # martes lo reservas a mano, no esta aqui
  mie:
    - { clase: TONIC, hora: "12:10" }
  jue:
    - { clase: SAVAGE, hora: "09:55" }
  vie:
    - { clase: TONIC, hora: "06:15" }
  sab:
    - { clase: TONIC, hora: "07:10" }
  dom:
    - { clase: SAVAGE, hora: "07:15" }

# Si la apertura fallo o el gimnasio cancela, el bot sigue cazando cupo
# liberado cada intervalo_min minutos hasta que empiece la clase.
rescate:
  activo: true
  intervalo_min: 15

# Ajustes del disparo
adelanto_seg: 2        # margen en segundos con que empieza a intentar antes de la apertura
rafaga_seg: 120        # cuanto tiempo maximo seguir intentando tras la apertura
intervalo_seg: 0.5     # pausa entre intentos

# Opcional: avisos al celular (ntfy.sh, etc.)
# notificar_url: https://ntfy.sh/mi-topic-secreto
